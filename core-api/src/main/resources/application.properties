spring.application.name=gestion-academica-core
server.port=${CORE_API_PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ficct_sistemas_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security
jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Internal API Communication
internal.api.shared-secret=${INTERNAL_SHARED_SECRET:ficct_super_secret_internal_key_2026}
ai.worker.url=${AI_WORKER_URL:http://127.0.0.1:8000}

# Storage Configuration
storage.base-path=${STORAGE_BASE_PATH:C:/Users/vajho/Desktop/SistemaFICCT/storage}

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

